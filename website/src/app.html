<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- ICO first: browsers that render favicons at 16px pick it, and the
		     silhouette survives that size where the faceted mark does not. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="preload" as="font" type="font/woff2" crossorigin
			href="%sveltekit.assets%/fonts/space-grotesk-300-700-latin.woff2" />
		<meta name="theme-color" content="#facc15" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
