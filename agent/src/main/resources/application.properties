# Fallback only: the server a first `agent login` talks to when neither
# --server nor the credentials file names one. Every later run reads the
# stored URL through CredentialsConfigSource.
quarkus.rest-client.pruefstein-api.url=http://localhost:8080
quarkus.jackson.write-dates-as-timestamps=false
# Off for the CLI: with the startup logs quiet the banner ends up flushed
# after the command's own output, so `--help` prints its usage and then seven
# lines of ASCII art. QUARKUS_BANNER_ENABLED=true brings it back.
quarkus.banner.enabled=false
quarkus.banner.path=banner.txt

# ── Compliance run ─────────────────────────────────────────────────────
# Checks run concurrently, each in its own osqueryi process. A cap, not a
# target: a run starts no more than there are checks to run. Turn it down on
# a machine that has to stay responsive while the agent works.
pruefstein.agent.check-parallelism=100

# Disable scheduler by default — use the 'run' CLI command or configure a system cron job
quarkus.scheduler.enabled=false

# The identity provider, client id and scopes are not configured here. The
# agent asks the server it reports to (GET /internal/agent-config) and
# discovers the endpoints from that issuer, so the same binary works against a
# Keycloak and an Entra deployment without a rebuild.

# ── Logging: this is a CLI, not a service ──────────────────────────────
# "Profile prod activated", "Installed features: [cdi, picocli, …]" and the
# scheduler notice tell whoever runs a compliance check nothing, so the root
# logger sits at WARN and only the agent's own progress reaches the console.
# min-level stays at DEBUG so the debug statements remain reachable without a
# rebuild — the reason a token refresh failed is only logged there. Reaching
# them takes the category, not the root level: an explicit category level pins
# its own subtree, so QUARKUS_LOG_LEVEL=DEBUG raises everything except
# com.pruefstein. Use QUARKUS_LOG_CATEGORY__COM_PRUEFSTEIN__LEVEL=DEBUG.
# Quarkus paints log messages with 256-colour codes of its own — 38;5;231,
# 38;5;251, 38;5;253, i.e. near-white and two light greys. They are picked for
# a dark terminal, wash out to grey on a light one, and they sit on top of
# whatever ConsoleStyle chose. Off, so the message reaches the terminal as
# written and the agent's own colours are the only ones in play.
quarkus.console.color=false
quarkus.log.level=WARN
quarkus.log.min-level=DEBUG
quarkus.log.category."com.pruefstein".level=INFO
# Bare messages: no timestamp, level or category in front of "3/5 checks
# passed". Stack traces stay (%e) — a check that errored has to be diagnosable.
quarkus.log.console.format=%s%e%n
