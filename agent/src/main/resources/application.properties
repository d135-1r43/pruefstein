# Fallback only: the server a first `agent login` talks to when neither
# --server nor the credentials file names one. Every later run reads the
# stored URL through CredentialsConfigSource.
quarkus.rest-client.pruefstein-api.url=http://localhost:8080
quarkus.jackson.write-dates-as-timestamps=false

# ── Compliance run ─────────────────────────────────────────────────────
# Checks run concurrently, each in its own osqueryi process. A cap, not a
# target: a run starts no more than there are checks to run. Turn it down on
# a machine that has to stay responsive while the agent works.
pruefstein.agent.check-parallelism=100

# ── Logging ────────────────────────────────────────────────────────────
# A command-line tool, not a server: every command already says what it has
# to say on stdout, so the log stays out of the way and only speaks up when
# something goes wrong.
#
#   PRUEFSTEIN_AGENT_LOG_LEVEL=DEBUG pruefstein-agent run
#
quarkus.log.level=${pruefstein.agent.log-level:WARN}
quarkus.log.console.level=${pruefstein.agent.log-level:WARN}

# The banner is written straight to the console rather than through the log,
# so the level above does not reach it. Off outright here: six lines of
# ASCII art ahead of every `login` is not what a CLI is for. Both switches
# are needed — the generator extension draws its own banner without asking
# the core one — and both are build-time, so neither can follow
# PRUEFSTEIN_AGENT_LOG_LEVEL.
quarkus.banner.enabled=false
quarkus.banner-generator.enabled=false

# Kept so turning the banner back on draws the same one it always did:
# generated from this text rather than committed as art, which is what made
# it a line of configuration instead of six lines nobody can edit. `big` is
# the FIGlet font the checked-in banner.txt was made with.
quarkus.banner-generator.text=PRUEFSTEIN
quarkus.banner-generator.font=big

# Disable scheduler by default — use the 'run' CLI command or configure a system cron job
quarkus.scheduler.enabled=false

# The identity provider, client id and scopes are not configured here. The
# agent asks the server it reports to (GET /internal/agent-config) and
# discovers the endpoints from that issuer, so the same binary works against a
# Keycloak and an Entra deployment without a rebuild.
