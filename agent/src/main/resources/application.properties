quarkus.rest-client.pruefstein-api.url=http://localhost:8080
quarkus.jackson.write-dates-as-timestamps=false

# Disable scheduler by default — use the 'run' CLI command or configure a system cron job
quarkus.scheduler.enabled=false

# ── OIDC client credentials (machine-to-machine auth against web API) ──
quarkus.oidc-client.auth-server-url=http://localhost:8180/realms/pruefstein
quarkus.oidc-client.client-id=pruefstein-agent
quarkus.oidc-client.credentials.secret=${AGENT_SECRET:pruefstein-agent-secret}
quarkus.oidc-client.grant.type=client-credentials

# ── Production overrides ────────────────────────────────────────────────
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL}/realms/pruefstein
%prod.quarkus.oidc-client.credentials.secret=${AGENT_SECRET}
