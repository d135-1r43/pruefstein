quarkus.rest-csrf.require-form-url-encoded=false
quarkus.jackson.write-dates-as-timestamps=false
quarkus.banner.path=banner.txt

# ── OIDC: default tenant — web browser login (code flow) ───────────────
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=pruefstein-web
quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/

# ── OIDC: api tenant — bearer token for agents ─────────────────────────
quarkus.oidc.api.application-type=service
quarkus.oidc.api.client-id=pruefstein-web
quarkus.oidc.api.auth-server-url=${quarkus.oidc.auth-server-url}

# ── Keycloak dev service (fixed port so the agent can share it) ─────────
quarkus.keycloak.devservices.port=8180
quarkus.keycloak.devservices.realm-path=keycloak/pruefstein-realm.json

# ── HTTP auth: protect everything; allow q/ and internal flow callbacks ─
quarkus.http.auth.permission.public.paths=/q/*,/oidc-logout,/internal/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ── LangChain4j / OpenAI ───────────────────────────────────────────────
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.response-format=json_object

# ── Compliance flow ────────────────────────────────────────────────────
pruefstein.compliance.remediation-days=7
pruefstein.compliance.reporting-interval-days=7
pruefstein.internal.base-url=http://localhost:${quarkus.http.port:8080}
quarkus.flow.messaging.defaults-enabled=true
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topic=flow-in
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.outgoing.flow-events-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-events-out.topic=flow-in
mp.messaging.outgoing.flow-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.topic=flow-out
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ── Production overrides ───────────────────────────────────────────────
%prod.quarkus.oidc.auth-server-url=https://keycloak.example.com/realms/pruefstein
%prod.quarkus.oidc.api.auth-server-url=https://keycloak.example.com/realms/pruefstein

# ── Test profile: no Keycloak, no real AI key needed ───────────────────
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.flow.messaging.defaults-enabled=false
%test.mp.messaging.incoming.flow-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.flow-events-out.connector=smallrye-in-memory
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.api.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.http.auth.permission.authenticated.policy=permit
%test.quarkus.langchain4j.openai.enable-integration=false
