quarkus.rest-csrf.require-form-url-encoded=false
quarkus.jackson.write-dates-as-timestamps=false

# ── OIDC: default tenant — web browser login (code flow) ───────────────
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=pruefstein-web
quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/

# ── OIDC: api tenant — bearer token for agents ─────────────────────────
quarkus.oidc.api.application-type=service
quarkus.oidc.api.client-id=pruefstein-web
quarkus.oidc.api.auth-server-url=${quarkus.oidc.auth-server-url}

# ── Keycloak dev service (fixed port so the agent can share it) ─────────
quarkus.keycloak.devservices.port=8180
quarkus.keycloak.devservices.realm-path=keycloak/pruefstein-realm.json

# ── HTTP auth: protect everything; allow q/ (health/swagger) publicly ───
quarkus.http.auth.permission.public.paths=/q/*,/oidc-logout
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ── LangChain4j / OpenAI ───────────────────────────────────────────────
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.response-format=json_object

# ── Production overrides ───────────────────────────────────────────────
%prod.quarkus.oidc.auth-server-url=https://keycloak.example.com/realms/pruefstein
%prod.quarkus.oidc.api.auth-server-url=https://keycloak.example.com/realms/pruefstein
