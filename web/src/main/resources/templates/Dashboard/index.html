{#include main.html}
{#title}Dashboard — Prüfstein{/title}

<div class="max-w-4xl">

  <div class="mb-10">
    <h1 class="text-4xl font-black tracking-tight">Dashboard</h1>
    <p class="text-sm font-medium text-stone-500 mt-1">Fleet compliance overview.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

    <div class="bg-white border-2 border-black shadow-brutal p-6">
      <p class="text-[10px] font-black tracking-widest text-stone-400">Users</p>
      <p class="text-5xl font-black mt-2">{userCount}</p>
      <p class="text-xs font-medium text-stone-400 mt-2">registered accounts</p>
    </div>

    <div class="bg-white border-2 border-black shadow-brutal p-6">
      <p class="text-[10px] font-black tracking-widest text-stone-400">Reports</p>
      <p class="text-5xl font-black mt-2">{reportCount}</p>
      <p class="text-xs font-medium text-stone-400 mt-2">agent runs received</p>
    </div>

    <div class="bg-white border-2 border-black shadow-brutal p-6">
      <p class="text-[10px] font-black tracking-widest text-stone-400">Checks</p>
      <p class="text-5xl font-black mt-2">{itemCount}</p>
      <p class="text-xs font-medium text-stone-400 mt-2">items tracked</p>
    </div>

    <div class="bg-accent border-2 border-black shadow-brutal p-6">
      <p class="text-[10px] font-black tracking-widest text-stone-700">Issues</p>
      <p class="text-5xl font-black mt-2">{issueCount}</p>
      <p class="text-xs font-bold text-stone-700 mt-2">failing checks</p>
    </div>

  </div>

</div>

{/include}
