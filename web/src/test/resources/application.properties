# Disable OIDC and Keycloak dev service in tests — no Keycloak needed
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.authenticated.policy=permit

# Provide a dummy API key so the langchain4j extension starts up
quarkus.langchain4j.openai.enable-integration=false
